projectName=piplex
projectGroup=io.github.green4j
projectAuthor=Anatoly Gudkov
# the copyright holder, as it appears in LICENSE, the file headers and the javadoc footer
projectCopyright=2026 Anatoly Gudkov and others

srcJavaVersion=21

checkstyleVersion=10.26.1
jupiterVersion=5.11.3
# pinned rather than left to Gradle's default, because the Jenkins plugin's own configurations
# resolve the test runtime and cannot do it without a version
junitPlatformVersion=1.11.3

greenJellyVersion=0.1.6
# 0.0.4 is the floor rather than a preference: the guard on an admitted run has to tell a watch that
# reached its deadline from one that reported the newest thing it saw while its polls were failing,
# and WatchResult.confirmed() is where that answer arrives.
discasVersion=0.0.4

# compile-time only, and neither reaches a controller: they generate the index Jenkins finds an
# extension through
sezpozVersion=1.13
annotationIndexerVersion=1.18

# the Jenkins baseline the plugin is built and tested against: the oldest controller it has to run on,
# and what the .hpi stamps as Jenkins-Version. Raising it is not an upgrade -- it stops the plugin
# installing on every controller below it. 2.555.1 is where Java 21 became Jenkins' own floor, so
# srcJavaVersion above asks for nothing this line does not already require; it is also the first LTS
# Java 25 is supported on, which is what lets the build run on both.
jenkinsVersion=2.555.1
jpiPluginVersion=0.58.0-rc.5
