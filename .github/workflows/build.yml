name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gradle-build:
    name: Gradle Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21', '25' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Build
        run: ./gradlew --no-daemon --stacktrace clean build

  # The baseline is what gradle-build above already covers, and it is the version the .hpi is stamped
  # with. This says the plugin also still works on the newest LTS, which is the other half of the claim
  # and the half nothing else checks. It is not a second baseline: the manifest keeps naming the oldest
  # controller piplex runs on, and raising that is a separate, deliberate decision.
  #
  # Only the plugin module, and only the release JDK: the engine and the store adapter have no Jenkins
  # in them at all -- checkCoreIsHostAgnostic is what keeps that true -- so running them again here
  # would test nothing a moment longer.
  jenkins-lts:
    name: Jenkins plugin (Jenkins ${{ matrix.jenkins }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Only a version the jenkinsLines table in build.gradle knows: the BOM that goes with it comes
        # from there, so one value here selects both and they cannot drift apart.
        jenkins: [ '2.568.3' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Test the plugin against Jenkins ${{ matrix.jenkins }}
        run: >-
          ./gradlew --no-daemon --stacktrace :piplex-jenkins:test
          -PjenkinsVersion=${{ matrix.jenkins }}
