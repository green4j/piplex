name: Build

on:
  # Called by release.yml, so a tag is released only if the same checks that guard main have passed
  # against the tagged commit.
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gradle-build:
    name: Gradle Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      # The .hpi is packaged here rather than only at release time. `build` does not produce one -- the
      # jpi task is not wired into it, which is why release.yml names the task -- so without this line
      # the first run of the packaging is the run that happens after a tag has been pushed, which is the
      # one moment it is too late to fix.
      - name: Build and package
        run: ./gradlew --no-daemon --stacktrace clean build :piplex-jenkins:jpi

      # The two manifest entries a controller refuses a plugin on. Both are set by hand in build.gradle
      # -- Jenkins-Version from the baseline, Minimum-Java-Version because jpi2 would otherwise infer 17
      # from a toolchain this build deliberately does not pin -- so both are worth reading back out of
      # the file rather than trusting to have been written.
      - name: Check what the .hpi says
        shell: bash
        run: |
          hpi="$(ls piplex-jenkins/build/libs/piplex-*.hpi)"
          echo "Packaged ${hpi}"
          manifest="$(unzip -p "${hpi}" META-INF/MANIFEST.MF | tr -d '\r')"
          echo "${manifest}"
          for entry in Jenkins-Version Minimum-Java-Version Plugin-Version; do
            if ! grep -q "^${entry}: ." <<<"${manifest}"; then
              echo "The manifest has no ${entry}"
              exit 1
            fi
          done
