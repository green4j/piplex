plugins {
    id 'org.jenkins-ci.jpi2' version "${jpiPluginVersion}" apply false
}

defaultTasks 'clean', 'build'

def projectVersion = file('version.txt').text.trim()

def configProperty = { final String propertyName ->
    String value = project.findProperty(propertyName)
    if (!value) {
        value = System.getenv(propertyName)
        if (!value) {
            return null
        }
    }
    return value.trim()
}

def piplexSrcJavaVersion = JavaVersion.toVersion(srcJavaVersion)

def piplexSourceEncoding = 'US-ASCII'

def coreProject = project(':piplex-core')
def discasProject = project(':piplex-discas')
def jenkinsProject = project(':piplex-jenkins')
def initProject = project(':piplex-init')
def exampleProject = project(':piplex-example')

subprojects {
    apply plugin: 'java-library'

    group = projectGroup
    version = projectVersion

    repositories {
        mavenCentral()
    }

    javadoc {
        failOnError = false

        title = "<h1>${projectName}</h1>"
        options.bottom = "<i>Copyright &#169; ${projectCopyright}. All Rights Reserved.</i>"
        options.encoding = 'UTF-8'
        options.docEncoding = 'UTF-8'
        options.charSet = 'UTF-8'
        options.addBooleanOption 'html5', true
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
    }

    jar {
        manifest {
            attributes 'Implementation-Title': projectName,
                    'Implementation-Version': projectVersion,
                    'Implementation-Vendor': projectAuthor
        }
        includeEmptyDirs = false
    }
}

// Everything gets checkstyle and the same test setup.
configure([coreProject,
           discasProject,
           jenkinsProject,
           initProject,
           exampleProject]) {
    apply plugin: 'checkstyle'

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter:${jupiterVersion}"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitPlatformVersion}"

        checkstyle "com.puppycrawl.tools:checkstyle:${checkstyleVersion}"
    }

    compileJava {
        sourceCompatibility = piplexSrcJavaVersion
        targetCompatibility = piplexSrcJavaVersion

        // --release rather than -source/-target alone: it also pins the API, and it keeps the
        // "bootstrap class path not set" note -- which -Werror turns into a failure -- off newer JDKs.
        options.release = piplexSrcJavaVersion.majorVersion as Integer
        options.compilerArgs.addAll(['-Xlint:all', '-Werror']) // enable all warnings and treat them as errors
        options.encoding = piplexSourceEncoding
        options.deprecation = true
    }

    compileTestJava {
        options.encoding = piplexSourceEncoding
    }

    checkstyle {
        toolVersion = "${checkstyleVersion}"
    }

    test {
        useJUnitPlatform()

        testLogging {
            events 'skipped', 'failed'
            showStandardStreams = true
            exceptionFormat = 'full'
        }

        // One line per module saying how many tests ran, which Gradle itself does not print. A listener
        // rather than the task's own afterSuite hook: that one is deprecated in 9 and gone in 10.
        addTestListener([
                beforeSuite: { desc -> },
                afterSuite: { desc, result ->
                    if (!desc.parent) {
                        println "Results: ${result.resultType} (${result.testCount} tests, " +
                                "${result.successfulTestCount} successes, " +
                                "${result.failedTestCount} failures, " +
                                "${result.skippedTestCount} skipped)"
                    }
                },
                beforeTest: { desc -> },
                afterTest: { desc, result -> }
        ] as TestListener)
    }
}

// Coverage is for everything that ships, the .hpi included. The examples are the exclusion: they exist
// to be read and run, and a coverage figure over them is one nobody should act on.
configure([coreProject,
           discasProject,
           jenkinsProject,
           initProject]) {
    apply plugin: 'jacoco'

    check {
        dependsOn jacocoTestReport
    }
}

configure(coreProject) {
    // What every CoordinationStore owes the primitives, shared with the adapters' own tests.
    apply plugin: 'java-test-fixtures'

    // The core stays host-agnostic. The Jenkins plugin is an adapter over it, and a second host later --
    // Airflow, or anything else -- must mean another adapter, not a rewritten engine. That only holds if
    // nothing from a host ever reaches this module, so the build checks rather than trusts.
    tasks.register('checkCoreIsHostAgnostic') {
        // Named one by one: a group-wide pass would let in discas-client, or anything else we publish.
        final def allowed = ["${projectGroup}:green-jelly".toString()] as Set
        final def runtime = configurations.runtimeClasspath
        doLast {
            final def foreign = runtime.resolvedConfiguration.resolvedArtifacts.collect {
                "${it.moduleVersion.id.group}:${it.moduleVersion.id.name}".toString()
            }.findAll { !allowed.contains(it) }
            if (!foreign.isEmpty()) {
                throw new GradleException(
                        "piplex-core may depend on ${allowed} only, but found: ${foreign}. " +
                        'Anything host-specific belongs in an adapter module.')
            }
        }
    }

    check.dependsOn checkCoreIsHostAgnostic

    dependencies {
        // The only runtime dependency of the core: the discas client carries no JSON at all, and the
        // records piplex keeps in a key are JSON.
        api "io.github.green4j:green-jelly:$greenJellyVersion"

        testFixturesApi "org.junit.jupiter:junit-jupiter:${jupiterVersion}"
    }
}

configure(discasProject) {
    dependencies {
        api project(coreProject.path)
        api "io.github.green4j:discas-client:$discasVersion"

        testImplementation "io.github.green4j:discas-node:$discasVersion"
        testImplementation testFixtures(project(coreProject.path))
    }
}

// The adapter for one host, and the only thing this build ships: a .hpi is installed into a
// controller, not depended on.
configure(jenkinsProject) {
    apply plugin: 'org.jenkins-ci.jpi2'

    repositories {
        jenkinsPublic()
    }

    def jenkinsBaseline = configProperty('jenkinsVersion') ?: project.property('jenkinsVersion')
    def patchSeparator = jenkinsBaseline.lastIndexOf('.')
    if (patchSeparator < 1) {
        throw new GradleException(
                "jenkinsVersion must name a release such as 2.568.3, got '${jenkinsBaseline}'")
    }
    def jenkinsLine = jenkinsBaseline.substring(0, patchSeparator)
    def jenkinsBomVersion = configProperty('jenkinsBomVersion')
            ?: project.property('jenkinsBomVersion')
    def jenkinsBom = "bom-${jenkinsLine}.x:${jenkinsBomVersion}"

    jenkinsPlugin {
        jenkinsVersion = jenkinsBaseline
        pluginId = 'piplex'
        displayName = 'piplex'
        homePage = uri('https://github.com/green4j/piplex')
        archiveExtension = 'hpi'
    }

    dependencies {
        // One line fixes every Jenkins plugin version, as a set that is known to work with the
        // baseline above. Picking them one at a time is how a plugin ends up requiring a newer
        // controller than it says it does.
        implementation platform("io.jenkins.tools.bom:${jenkinsBom}")

        implementation project(coreProject.path)
        implementation project(discasProject.path)

        implementation 'org.jenkins-ci.plugins.workflow:workflow-step-api'
        implementation 'org.jenkins-ci.plugins.workflow:workflow-api'
        implementation 'org.jenkins-ci.plugins:structs'

        // An operator block acts under an identity of its own, and the credential carrying it is
        // resolved against the running build rather than read from the global configuration. That
        // resolution is what enforces who may act as the operations client: a folder-scoped
        // credential is invisible to jobs outside the folder. Doing it any other way -- a second
        // identity in Manage Jenkins -- would hand every job on the controller the same rights.
        implementation 'org.jenkins-ci.plugins:credentials'
        // The two credential kinds a discas node authenticates on: a client certificate under
        // --client-auth mtls, and a token under --client-auth token. The certificate type is in
        // credentials itself; secret text is not.
        implementation 'org.jenkins-ci.plugins:plain-credentials'

        // Jenkins finds an extension through an index generated at compile time, not by scanning at
        // startup. Without these two on the processor path everything compiles and nothing is found.
        annotationProcessor "net.java.sezpoz:sezpoz:$sezpozVersion"
        annotationProcessor "org.jenkins-ci:annotation-indexer:$annotationIndexerVersion"

        testImplementation 'org.jenkins-ci.plugins.workflow:workflow-job'
        testImplementation 'org.jenkins-ci.plugins.workflow:workflow-cps'
        testImplementation 'org.jenkins-ci.plugins.workflow:workflow-durable-task-step'
        testImplementation 'org.jenkins-ci.plugins.workflow:workflow-basic-steps'
        // Only to answer one question: does an options{} wrapper apply before the top-level agent is
        // allocated. Declarative is not a dependency of the plugin itself.
        testImplementation 'org.jenkinsci.plugins:pipeline-model-definition'
        testImplementation 'org.jenkins-ci.main:jenkins-test-harness'
        // The generator, so these tests run the jobs a deployment actually installs rather than a
        // template nobody filled in. Test only: nothing in the .hpi knows this module exists.
        testImplementation project(initProject.path)


        // The restart test needs JenkinsSessionRule, which is a JUnit 4 rule and has no JUnit 5
        // equivalent. One test class runs on the vintage engine; the rest stay on Jupiter.
        testRuntimeOnly "org.junit.vintage:junit-vintage-engine:${jupiterVersion}"
    }

    // Jenkins annotations are claimed by processors that do not announce which ones they handle, so
    // javac reports every one of them as unclaimed. The index is generated all the same -- checked by
    // looking for META-INF/annotations in the jar -- and -Werror stays on for everything else.
    compileJava {
        options.compilerArgs.add('-Xlint:-processing')
    }

    // Named after the plugin rather than after the module, so what the build writes is byte for byte
    // the file a release publishes and an operator installs: piplex-<version>.hpi.
    tasks.named('jpi') {
        archiveBaseName = 'piplex'

        // jpi2 reads Minimum-Java-Version off the toolchain and stamps 17 when there is none. A
        // toolchain would pin the JDK the build compiles with, which is the one thing the CI matrix is
        // there to vary, so the attribute is written rather than implied. A controller refuses a plugin
        // that asks for more Java than it runs, and this is the number it refuses on.
        manifest {
            attributes 'Minimum-Java-Version': piplexSrcJavaVersion.majorVersion
        }
    }

    // Resuming a CPS flow deserialises through XStream, which reads private fields of java.base types
    // -- TreeSet's backing map among them -- and a JDK past 16 refuses that unless the package is
    // opened. A controller gets these from the Add-Opens entry in jenkins.war's manifest, which only
    // applies to `java -jar`; the test JVM is launched by Gradle, so the same list goes here.
    test {
        jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                '--add-opens=java.base/java.io=ALL-UNNAMED',
                '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-opens=java.desktop/com.sun.beans.introspect=ALL-UNNAMED'

        // HtmlUnit's JavaCC-generated parser already has a method close to the JVM's 64 KiB limit.
        // JaCoCo probes push it over that limit even though dependency classes are not in our report.
        jacoco {
            excludes = ['org.htmlunit.cssparser.parser.javacc.CSS3ParserTokenManager']
        }
    }

    // What a running build writes down, recorded once per STATE_VERSION and committed; the build only
    // reads it (StateFixturesTest). Recording is a person's step: bytes the build made for itself would
    // always agree with the code that made them.
    test {
        useJUnitPlatform {
            excludeTags 'record-state-fixtures'
        }
        // The operator job templates reach these tests on piplex-init's classpath, where the
        // generator reads them: the tests run what a deployment installs rather than a copy of it,
        // which is the only way a job that stops working gets noticed here instead of during an
        // incident. Editing a template rebuilds that jar, so this task is invalidated with it.
    }

    sourceSets {
        intTest {
            // The unit tests' output too, for the helpers both sets share -- KeyStores among them.
            compileClasspath += sourceSets.main.output + sourceSets.test.output
            runtimeClasspath += sourceSets.main.output + sourceSets.test.output
        }
    }

    configurations {
        intTestImplementation.extendsFrom testImplementation
        intTestRuntimeOnly.extendsFrom testRuntimeOnly
    }

    dependencies {
        intTestImplementation platform("org.testcontainers:testcontainers-bom:${testcontainersVersion}")
        intTestImplementation 'org.testcontainers:testcontainers'
    }

    tasks.register('intTest', Test) {
        group = 'verification'
        description = 'Runs the plugin against a discas node from the published image'
        useJUnitPlatform()
        testClassesDirs = sourceSets.intTest.output.classesDirs
        // Plus whatever the jpi plugin adds to the unit tests' classpath beyond their own source set:
        // the directory jenkins-test-harness reads to install plugins into a JenkinsRule controller,
        // which it puts on that task rather than on the source set. Taken from the task instead of
        // named, so a jpi upgrade that moves the directory moves this with it.
        classpath = sourceSets.intTest.runtimeClasspath +
                (tasks.test.classpath - sourceSets.test.runtimeClasspath)
        dependsOn tasks.named('copyTestPluginDependencies')

        // The same opens the unit tests need: this one starts a controller too.
        jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                '--add-opens=java.base/java.io=ALL-UNNAMED',
                '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-opens=java.desktop/com.sun.beans.introspect=ALL-UNNAMED'

        systemProperty 'piplex.discasVersion', discasVersion

        // Colima puts its socket in the home directory and binds nothing at /var/run/docker.sock, so
        // Testcontainers otherwise finds no daemon and the required suite fails on a machine that
        // does have one.
        def colima = file("${System.getProperty('user.home')}/.colima/default/docker.sock")
        if (!System.getenv('DOCKER_HOST') && !file('/var/run/docker.sock').exists() && colima.exists()) {
            environment 'DOCKER_HOST', "unix://${colima}"
            environment 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE', '/var/run/docker.sock'
        }

        testLogging {
            events 'skipped', 'failed'
            showStandardStreams = true
            exceptionFormat = 'full'
        }
    }

    check.dependsOn intTest

    tasks.register('recordStateFixtures', Test) {
        group = 'verification'
        description = 'Records the saved-state fixtures of the current STATE_VERSION, once'
        testClassesDirs = test.testClassesDirs
        classpath = test.classpath
        jvmArgs = test.jvmArgs
        useJUnitPlatform {
            includeTags 'record-state-fixtures'
        }
        systemProperty 'piplex.recordStateFixtures',
                file('src/test/resources/io/github/green4j/piplex/jenkins/state').path
        outputs.upToDateWhen { false }
    }

    // The jpi plugin brings sources and javadoc jars of its own, for a publication this build does not
    // make. Only the .hpi ships, so they are dead weight on every build.
    tasks.matching { it.name in ['javadoc', 'javadocJar', 'sourcesJar'] }.configureEach {
        enabled = false
    }
}

configure(initProject) {
    dependencies {
        // The key composition the runtime uses, not a second copy of it: a grant this writes and the
        // key a step writes are then the same string by construction rather than by review.
        implementation project(coreProject.path)
        // Prompt and GetOpts, which are dependency-free and already on this build's classpath. An
        // operator tool that drags a terminal library in is one more thing to ship.
        implementation "io.github.green4j:discas-common:$discasVersion"
    }

    // One jar an operator can copy to a machine and run. The two dependencies are small and
    // dependency-free themselves, and somebody preparing a deployment should not have to assemble a
    // classpath first -- the release archive's launchers run this jar directly.
    jar {
        manifest {
            attributes 'Main-Class': 'io.github.green4j.piplex.init.PiplexInit'
        }
        // Buildable, so this is also what tells Gradle the sibling jars have to exist first.
        dependsOn configurations.runtimeClasspath
        from {
            configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        // Signatures of the jars being unpacked, which no longer describe this one.
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/LICENSE*'
    }

    // Regeneration only. Gradle forks without a console, so System.console() is null and the
    // dialogue answers every question with its default rather than blocking a build -- which is
    // Prompt's whole contract. To be asked anything, run the jar from a terminal.
    //
    //   ./gradlew :piplex-init:run --args="--from estate.properties"
    //   java -jar piplex-init/build/libs/piplex-init-<version>.jar
    tasks.register('run', JavaExec) {
        group = 'application'
        description = 'Regenerates an estate --from a description; the dialogue needs a terminal'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'io.github.green4j.piplex.init.PiplexInit'
    }
}

configure(exampleProject) {
    dependencies {
        implementation project(coreProject.path)
        implementation project(discasProject.path)
    }

    // The examples exist to be read and run, and the second half needs a task. One task told which main
    // to run, rather than the application plugin: there is no single entry point here and no
    // distribution to build. A bare class name is enough -- they all live in the one package.
    //
    //   ./gradlew :piplex-example:run -PmainClass=ElectedRunExample
    //   ./gradlew :piplex-example:run -PmainClass=DiscasStoreExample \
    //           --args="euc1-blue eod n1=127.0.0.1:7101 n2=127.0.0.1:7102 n3=127.0.0.1:7103"
    def named = providers.gradleProperty('mainClass')
    tasks.register('run', JavaExec) {
        group = 'application'
        description = 'Runs one example, named with -PmainClass'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = named.map { name ->
            name.indexOf('.') < 0 ? "io.github.green4j.piplex.example.${name}" : name
        }
        doFirst {
            // Named rather than defaulted: five examples, and running whichever one happened to be
            // first is not what somebody who forgot the flag meant.
            if (!named.present) {
                throw new GradleException('Which example? Name it, as '
                        + './gradlew :piplex-example:run -PmainClass=ElectedRunExample')
            }
        }
    }
}
