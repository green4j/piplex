# piplex ACL: the operator has an identity of its own
#
# Operator writes belong to an identity that is not a controller. Controllers keep G on the keys they
# consult and can no longer designate an owner or stop the work.
#
# ONLY MEANINGFUL OVER token OR mtls. In allowall a client id is a claim rather than a proof, so a
# second identity there separates nothing -- and the plugin refuses to use one.
#
# Three things to know before changing it.
#
# 1. The last controller grant is self-drain: C on that controller's OWN per-owner switch key. Taking
#    a controller out is done from it, because whether work is still running there is a question about
#    processes, and requiring the operations identity for it would put that credential on every
#    controller and undo the separation. Grants add up rather than override, so this narrow C sits
#    beside the broad G without contradicting it.
#
# 2. Prefixes match raw text, not path segments, so .../@euc1-blue also matches .../@euc1-blue-2.
#    NO ownerId MAY BE A PREFIX OF ANOTHER, or a controller can drain the one whose name extends its
#    own. Nothing checks this for you.
#
# 3. milestone/ is deliberately absent from the operations grant. Publishing asserts that a particular
#    controller finished particular work, so it stays with that controller -- including when an
#    operator publishes one to release a stuck consumer, which is therefore done from the producing
#    controller.
#
# See docs/07-discas.md#the-files-in-acl

acl.piplex-euc1-blue = piplex/prod/exclusive/eod:GC ; piplex/prod/milestone/data/euc1:GC ; \
                       piplex/prod/instances/euc1-blue:GC ; piplex/prod/designated/eod-owner:G ; \
                       piplex/prod/enabled/eod-switch:G ; \
                       piplex/prod/enabled/eod-switch/@euc1-blue:GC ; /dc/active:G

acl.piplex-euc1-green = piplex/prod/exclusive/eod:GC ; piplex/prod/milestone/data/euc1:GC ; \
                        piplex/prod/instances/euc1-green:GC ; piplex/prod/designated/eod-owner:G ; \
                        piplex/prod/enabled/eod-switch:G ; \
                        piplex/prod/enabled/eod-switch/@euc1-green:GC ; /dc/active:G

# The identity the operator jobs act as. Under mtls, issue it a certificate whose CN is this name.
acl.piplex-ops = piplex/prod/designated/:GC ; piplex/prod/enabled/:GC
