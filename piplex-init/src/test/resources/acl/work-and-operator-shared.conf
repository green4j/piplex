# piplex ACL: the operator acts as the controller, a grant per environment
#
# Every controller belongs to one team. They can affect one another's work and nothing prevents it,
# which is the right trade where the people who could do the affecting are the people running it.
#
# Change: the client ids, the environment segment, and the active key if the work follows one.
# Then point discas-node at this file with --client-acl-file and POST /reload.
#
# See docs/07-discas.md#the-files-in-acl

acl.piplex-euc1-blue  = piplex/prod/:GC ; /dc/active:G
acl.piplex-euc1-green = piplex/prod/:GC ; /dc/active:G
