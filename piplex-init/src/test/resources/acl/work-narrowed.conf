# piplex ACL: the operator acts as the controller, each identity granted key by key
#
# A controller may write only the lease it takes, the milestone it produces, and the two keys the
# operator jobs change. Everything else it needs, it reads.
#
# Worth the maintenance for one reason above the others: any job on a controller can publish to any
# milestone key, and a milestone is monotonic, so a wrong generation cannot be taken back by ordinary
# means. Naming the milestone here bounds that to the work this controller actually produces.
#
# The cost: every new work key is an edit to this file and a POST /reload, and a grant left out fails
# the work closed rather than silently.
#
# Two things to know before changing it.
#
# 1. The operator jobs run as the controller, so designation and the switch carry C as well as G.
#    That is the trade this file makes: any controller can hand the work over or drain any other.
#    Where that is too much, use operator-apart.conf, which keeps those writes for an identity of
#    its own.
#
# 2. Prefixes match raw text, not path segments. C on enabled/eod-switch therefore also covers every
#    per-owner key under it -- which is what lets a controller drain itself -- and .../@euc1-blue
#    would also match .../@euc1-blue-2. NO ownerId MAY BE A PREFIX OF ANOTHER. Nothing checks this
#    for you.
#
# Change: the client ids, the environment segment, and one block per controller naming its own keys.
#
# See docs/07-discas.md#the-files-in-acl

acl.piplex-euc1-blue = piplex/prod/exclusive/eod:GC ; piplex/prod/milestone/data/euc1:GC ; \
                       piplex/prod/instances/euc1-blue:GC ; piplex/prod/designated/eod-owner:GC ; \
                       piplex/prod/enabled/eod-switch:GC ; /dc/active:G

acl.piplex-euc1-green = piplex/prod/exclusive/eod:GC ; piplex/prod/milestone/data/euc1:GC ; \
                        piplex/prod/instances/euc1-green:GC ; piplex/prod/designated/eod-owner:GC ; \
                        piplex/prod/enabled/eod-switch:GC ; /dc/active:G
